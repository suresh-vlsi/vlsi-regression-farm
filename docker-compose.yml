services:
  eda-base:
    build: {context: ., dockerfile: docker/eda-base/Dockerfile}
    image: vlsi-eda-base:latest
    profiles: [build]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: farm, POSTGRES_PASSWORD: farm, POSTGRES_DB: farm}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  controller:
    build: {context: ., dockerfile: docker/controller/Dockerfile}
    environment: {DATABASE_URL: "postgresql://farm:farm@postgres/farm"}
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  dashboard:
    build: {context: ., dockerfile: docker/dashboard/Dockerfile}
    environment: {DATABASE_URL: "postgresql://farm:farm@postgres/farm"}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  # One runner; scale seeds with: docker compose run --rm -e SEED=7 runner
  runner:
    build: {context: ., dockerfile: docker/runner/Dockerfile}
    profiles: [run]
    environment:
      RUN_ID: compose
      TEST_NAME: fifo_random
      TOP: fifo
      MODULE: test_fifo
      TESTCASE: test_random
      SOURCES: rtl/fifo/fifo.v
      SEED: "1"
      CONTROLLER_URL: http://controller:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      controller:
        condition: service_healthy
      minio:
        condition: service_started
volumes: {pgdata: {}, miniodata: {}}
