# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install mon prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f prometheus-values.yaml
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: vlsi-controller
        metrics_path: /metrics
        static_configs:
          - targets: ["controller.vlsi-farm.svc:8000"]
