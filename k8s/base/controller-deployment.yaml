apiVersion: apps/v1
kind: Deployment
metadata: {name: controller, namespace: vlsi-farm}
spec:
  replicas: 1
  selector: {matchLabels: {app: controller}}
  template:
    metadata:
      labels: {app: controller}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: controller
      containers:
        - name: controller
          image: vlsi-controller:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: farm-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: farm-secrets, key: DATABASE_URL}}
          ports: [{containerPort: 8000}]
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: controller, namespace: vlsi-farm}
spec:
  selector: {app: controller}
  ports: [{port: 8000, targetPort: 8000}]
