# Copy to secrets.yaml (git-ignored), change values, then: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata: {name: farm-secrets, namespace: vlsi-farm}
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://farm:change-me@postgres/farm
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change-me-too
