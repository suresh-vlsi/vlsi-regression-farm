
apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, namespace: vlsi-farm}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
        - name: dashboard
          image: vlsi-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: DATABASE_URL

            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: farm-config
                  key: MINIO_ENDPOINT

            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: MINIO_ACCESS_KEY

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: farm-secrets
                  key: MINIO_SECRET_KEY

          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: dashboard, namespace: vlsi-farm}
spec:
  selector: {app: dashboard}
  ports: [{port: 8080, targetPort: 8080}]
