apiVersion: v1
kind: Service
metadata: {name: minio, namespace: vlsi-farm}
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000}
    - {name: console, port: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, namespace: vlsi-farm}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: farm-secrets, key: MINIO_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: farm-secrets, key: MINIO_SECRET_KEY}}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
